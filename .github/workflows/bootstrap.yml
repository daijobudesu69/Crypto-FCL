name: FCL bootstrap funding

# Manual saja. Isi ulang ledger funding dari arsip premium index Binance (data.binance.vision)
# kalau bot lama mati (> 3 hari) dan F14 kehilangan cakupan. Baris yang sudah ada tidak ditimpa.
#   gh workflow run bootstrap.yml -f days=16
on:
  workflow_dispatch:
    inputs:
      days:
        description: "jumlah hari arsip"
        default: "16"

permissions:
  contents: write

concurrency:
  group: fcl-state
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/bootstrap_funding.py --days "${{ inputs.days }}"
      - run: bash tools/save_state.sh "bootstrap funding: $(date -u +%Y-%m-%dT%H:%MZ)"
