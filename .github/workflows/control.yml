name: FCL control

# Ganti mode bot. Menulis control/bot.yaml di main; watcher membacanya setiap siklus
# (<= ~10 menit). Dari PowerShell / CMD / Git Bash:
#   gh workflow run control.yml -f mode=off
#   gh workflow run control.yml -f mode=paper
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "mode bot"
        type: choice
        options: ["tetap", "off", "paper"]
        default: tetap

permissions:
  contents: write

concurrency:
  group: fcl-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install PyYAML==6.0.3
      - name: Tulis control/bot.yaml
        env:
          MODE: ${{ inputs.mode }}
        run: bash tools/save_control.sh
